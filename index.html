<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone-Paper-Scissor Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Stone Paper Scissor Game</h1>
    <div class="choices">
    <div class="choice" id="stone"></div>
    <div class="choice" id="paper"></div>
    <div class="choice" id="scisor"></div>
</div>

<div class="score-board">
   <div class="score">
    <p id="user-score">0</p>
    <p>You</p></div>

        <p id="comp-score">0</p>
        <p>Comp</p></div>
        </div>
        

<div id="msg">Play your move</div>

    <script src="app.js" ></script>
</body>
</html>
